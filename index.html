<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211b22"><title>Марк & Алиса — библиотека</title><style>:root{--bg:#f7f0e8;--fg:#2c2427;--muted:#766a6b;--panel:#fffaf5;--accent:#743e50}body.dark{--bg:#201b22;--fg:#f2e8e0;--muted:#b8a6a8;--panel:#302630;--accent:#d7a9b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}header{padding:17px 20px;background:#211b22;color:#f3e6dc;display:flex;justify-content:space-between;align-items:center;font-family:system-ui}header strong{letter-spacing:2px;font-size:14px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 14px;background:var(--accent);color:white;font-size:14px}header button{background:#4a3540}main{max-width:700px;margin:auto;padding:24px 19px 70px}.hero{background:linear-gradient(145deg,#251d25,#613747);border-radius:17px;color:#f9eee7;padding:46px 25px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center}.hero small{letter-spacing:3px;color:#d7b9b5}.hero h1{font-size:37px;letter-spacing:3px;margin:15px 0}.hero p{font-style:italic;color:#e4cbd0}.chapter{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;margin:12px 0;background:var(--panel);color:var(--fg);padding:20px;border:1px solid #a68b8b44}.chapter span{color:var(--muted);font-size:12px}.reader{line-height:1.85;font-size:18px}.reader p{margin:0 0 1.2em;text-indent:1.1em}.reader h2{text-align:center;margin:28px 0 4px}.reader .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:32px}.art{margin:25px 0;background:linear-gradient(135deg,#33242b,#875663);color:#f9e8e4;border-radius:14px;padding:42px 20px;text-align:center;font-style:italic}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar button{background:var(--panel);color:var(--fg);border:1px solid #a68b8b55}.nav{display:flex;gap:10px;margin-top:35px}.nav button{flex:1}.note{color:var(--muted);font-family:system-ui;font-size:12px;line-height:1.5}#reading{display:none}</style></head><body><header><strong>МАРК & АЛИСА</strong><button onclick="goHome()">☰ Оглавление</button></header><main><section id="home"><div class="hero"><small>ЗАКРЫТЫЕ СТРАНИЦЫ</small><h1>МАРК & АЛИСА</h1><p>У каждой тайны есть своя цена</p></div><h2>Часть I · Наблюдатель</h2><button class="chapter" onclick="openChapter(0)"><div><span>ГЛАВА 01</span><br>Незваный гость</div>→</button><button class="chapter" onclick="openChapter(1)"><div><span>ГЛАВА 02</span><br>Следы прошлого</div>→</button><p class="note">Это демонстрационный текст и временные названия. Позже заменим их твоей рукописью и настоящими иллюстрациями.</p></section><section id="reading"><div class="toolbar"><button onclick="toggleTheme()">☾ День / ночь</button><button onclick="changeFont(-1)">А−</button><button onclick="changeFont(1)">А+</button></div><article class="reader" id="article"></article><div class="nav"><button onclick="goHome()">← Оглавление</button><button id="next" onclick="nextChapter()">Далее →</button></div></section></main><script>const chapters=[{title:'Незваный гость',text:['Алиса проснулась от едва различимого звука. Будто кто-то осторожно коснулся деревянной поверхности рядом с кроватью.','Она не открыла глаз. Прислушалась к тишине и вдруг поняла: в комнате кто-то есть.','— Не спишь? — прозвучал негромкий мужской голос.','Дыхание на мгновение сбилось. Она заставила себя лежать неподвижно.']},{title:'Следы прошлого',text:['На столе лежала записка. Алиса снова прочитала несколько слов, хотя уже знала их наизусть.','Она взяла чистый лист бумаги. Ей нужен был ответ. И она собиралась его получить.']}];let current=0;let size=Number(localStorage.getItem('readerSize')||18);if(localStorage.getItem('readerTheme')==='dark')document.body.classList.add('dark');function openChapter(i){current=i;localStorage.setItem('lastChapter',i);document.getElementById('home').style.display='none';document.getElementById('reading').style.display='block';const c=chapters[i];document.getElementById('article').innerHTML=`<h2>Глава ${i+1}</h2><div class="sub">${c.title}</div><div class="art">Место для иллюстрации к главе</div>`+c.text.map(t=>`<p>${t}</p>`).join('');document.getElementById('article').style.fontSize=size+'px';document.getElementById('next').textContent=i===chapters.length-1?'К оглавлению':'Следующая глава →';window.scrollTo(0,0)}function nextChapter(){current===chapters.length-1?goHome():openChapter(current+1)}function goHome(){document.getElementById('reading').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0)}function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('readerTheme',document.body.classList.contains('dark')?'dark':'light')}function changeFont(n){size=Math.max(15,Math.min(26,size+n));localStorage.setItem('readerSize',size);document.getElementById('article').style.fontSize=size+'px'}</script></body></html>
